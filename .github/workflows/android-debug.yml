name: Compilar APK Android (pruebas)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar sanitizador Java
        run: python3 tools/test_prompt_safety_java.py
      - name: Instalar SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Instalar NDK y CMake
        run: sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Descargar llama.cpp (versión fijada)
        shell: bash
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          test -f vendor/llama.cpp/include/llama.h
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Comprobar fuentes
        run: python3 tools/verify_source.py
      - name: Compilar APK de pruebas
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar firma y registrar procedencia APK
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app-debug.apk > apk-signature.txt
          sha256sum app-debug.apk > apk.sha256
          git rev-parse HEAD > apk-commit.txt
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: repasumi-beta-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apk-signature.txt
            app/build/outputs/apk/debug/apk.sha256
            app/build/outputs/apk/debug/apk-commit.txt
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    if: github.ref == 'refs/heads/main'
    needs: debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: repasumi-beta-debug-apk
          path: artifact
      - name: Publicar APK 0.5.0 Study Preview en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.5.0-preview >/dev/null 2>&1; then
            gh release upload v0.5.0-preview "artifact/app-debug.apk#repasumi-0.5.0-preview.apk" --clobber
          else
            gh release create v0.5.0-preview "artifact/app-debug.apk#repasumi-0.5.0-preview.apk" \
              --title "Repasumi 0.5.0 Study Preview" \
              --notes "APK de pruebas Android (arm64). Incluye repaso adaptativo, tarjetas, modo examen, accesibilidad y generador local de preguntas. Compilación debug; no sustituye la versión estable." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
