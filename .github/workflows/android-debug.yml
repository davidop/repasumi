name: Compilar APK Android (pruebas)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Instalar NDK y CMake
        run: sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Descargar llama.cpp (versión fijada)
        shell: bash
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          test -f vendor/llama.cpp/include/llama.h
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Comprobar fuentes
        run: python3 tools/verify_source.py
      - name: Compilar APK de pruebas
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: repasumi-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
