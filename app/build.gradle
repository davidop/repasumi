plugins { id 'com.android.application' }

android {
    namespace 'com.davidop.estudiaenelbus'
    compileSdk 36

    defaultConfig {
        // Identificador provisional: revisar antes de publicar en Google Play.
        applicationId 'com.davidop.estudiaenelbus.dev'
        minSdk 26
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
        versionCode 7
        versionName '0.5.0-study-preview'
    }
    // Las compilaciones de pruebas se instalan en paralelo para preservar la versión estable.
    // No es una actualización in situ: las claves debug efímeras de CI pueden diferir.
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
