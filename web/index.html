/* Repasumi UI refresh: readable mobile-first, accessible tap targets and clear hierarchy. */
:root{--navy:#183C33;--teal:#116B55;--muted:#516A61;--paper:#fff;--border:#DCE8E1;--radius:24px}
body{background:#F7F9F5;color:var(--navy);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.shell{width:min(100%,640px);padding:18px 18px calc(116px + env(safe-area-inset-bottom))}
.brand h1{font-size:clamp(28px,7vw,35px);letter-spacing:-1.1px}
.brand small{font-size:12px;letter-spacing:.1em}
.greeting h2{font-size:clamp(26px,6.5vw,32px);line-height:1.2}
.greeting p,.muted{font-size:15px;line-height:1.6}
.top{padding:12px 0 20px}
.card{padding:22px;border-radius:24px;box-shadow:0 10px 34px rgba(22,61,59,.055)}
.btn{min-height:52px;border-radius:15px;font-size:16px;line-height:1.3;padding:13px 16px}
.btn.big{min-height:58px;font-size:17px}
.btn:focus-visible,.nav button:focus-visible,.field:focus-visible,summary:focus-visible{outline:3px solid #A45400;outline-offset:3px}
.btn:disabled{opacity:.55}
.field{min-height:54px;font-size:16px;padding:13px 15px}
.formlabel{font-size:15px;margin:20px 0 8px}
.field.area{font-size:14px;line-height:1.65;min-height:180px}
.hint{font-size:14px;line-height:1.6}
.error,.success{font-size:15px;line-height:1.5;padding:16px}
.nav-inner{max-width:640px}
.nav button{font-size:14px;min-height:65px;border-radius:16px}
.nav .ico{font-size:25px}
.capture-card{border:1px solid #DCE7DF;background:#fff}
.capture-head{display:flex;gap:16px;align-items:flex-start}
.capture-symbol{width:55px;height:55px;border-radius:18px;background:#E5F4EB;display:grid;place-items:center;font-size:28px;flex:none}
.capture-head h3{font-size:23px;line-height:1.2;letter-spacing:-.5px;margin:4px 0 8px}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:.11em;color:#246E57}
.model-strip{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:20px 0;padding:12px 14px;border-radius:14px;background:#EDF7F0;color:#245D47;font-size:14px}
.model-strip>span:first-child{color:#178052;font-size:18px}
.model-strip strong{margin-left:auto;color:#135D44}
.model-setup{display:grid;gap:10px;margin:14px 0}
.model-settings{margin:0 0 15px}
.model-settings summary{cursor:pointer;color:#17654F;font-weight:700;padding:12px 4px;font-size:14px}
.text-button{border:0;background:transparent;color:var(--teal)}
.capture-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:24px 0 10px}
.step{font-size:12px;font-weight:750;color:#64776F;background:#F1F5F2;border-radius:11px;text-align:center;padding:10px 4px}
.step.current{color:#fff;background:#146C55}
.capture-action{border:2px dashed #B8D9C9;border-radius:22px;background:#F6FBF7;text-align:center;padding:24px 16px;margin-top:22px}
.capture-action-icon{display:block;font-size:38px;margin-bottom:6px}
.capture-action strong{font-size:20px;display:block}
.capture-action p{font-size:15px;color:#526C61;line-height:1.5;margin:8px 0 20px}
.progress-notice{padding:14px 16px;border-radius:14px;background:#E9F3FB;color:#194A65;font-weight:650;font-size:15px}
.capture-result{border-top:1px solid var(--border);margin-top:24px;padding-top:16px}
.capture-result h4{font-size:19px;margin:8px 0}
.capture-result .btn{margin-top:14px}
@media(max-width:390px){.shell{padding-inline:14px}.card{padding:18px}.capture-head{gap:12px}.capture-symbol{width:48px;height:48px}.capture-head h3{font-size:21px}.step{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}


/* Mejoras de accesibilidad: tipografía ampliada y movimiento reducido */
.large-text .question{font-size:29px;line-height:1.4}
.large-text .opt,.large-text .btn{font-size:18px;line-height:1.42;min-height:57px}
.large-text .muted,.large-text .hint,.large-text .pill,.large-text .progress-meta{font-size:15px}
.flip-card{min-height:285px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:24px}
.flip-card .question{width:100%}
.loading-card{min-height:220px}
.skeleton-loader{height:12px;border-radius:12px;background:linear-gradient(90deg,#def2e8,#8acdaf,#def2e8);background-size:200% 100%;animation:load 1.8s ease-in-out infinite;margin-top:20px}
@keyframes load{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

const ESO_MATERIA_2={title:"La materia y sus cambios · 2.º ESO",emoji:"⚗️",summary:["La materia tiene masa y ocupa un volumen. Puede encontrarse en estado sólido, líquido o gaseoso.","Los sólidos tienen forma y volumen definidos; los líquidos mantienen el volumen pero adoptan la forma del recipiente; los gases no tienen ni forma ni volumen fijos.","Las propiedades extensivas, como la masa y el volumen, dependen de la cantidad de materia. Las intensivas, como la densidad, no.","La densidad relaciona masa y volumen: d = m/V. Para calcular masa, m = d × V; para calcular volumen, V = m/d.","La teoría cinético-molecular explica que la materia está formada por partículas en movimiento, cuya agitación aumenta generalmente con la temperatura.","Los cambios de estado incluyen fusión, solidificación, vaporización, condensación y sublimación. Los recursos naturales pueden ser renovables o no renovables."],questions:[{"type":"mc","q":"¿Qué dos propiedades generales tiene toda materia?","a":"Masa y volumen","opts":["Masa y volumen","Color y dureza","Densidad y temperatura"],"why":"La materia tiene masa y ocupa un volumen.","src":"Foto 1 · La materia"},{"type":"match","q":"Relaciona cada estado con su característica.","pairs":[["Sólido","Forma y volumen fijos"],["Líquido","Volumen fijo y forma variable"],["Gas","Forma y volumen variables"]],"why":"Las partículas están distribuidas y se mueven de manera diferente en cada estado.","src":"Foto 1 · Estados de agregación"},{"type":"tf","q":"La densidad depende de la cantidad total de materia de una muestra homogénea.","a":false,"why":"La densidad es una propiedad intensiva: no depende de la cantidad de materia.","src":"Foto 2 · Propiedades de la materia"},{"type":"fill","q":"La densidad se calcula dividiendo la masa entre el ____.","a":"volumen","opts":["volumen","tiempo","peso"],"why":"La fórmula es d = m/V.","src":"Foto 2 · Densidad"},{"type":"mc","q":"Un objeto tiene 200 g de masa y 100 cm³ de volumen. ¿Cuál es su densidad?","a":"2 g/cm³","opts":["2 g/cm³","0,5 g/cm³","20 g/cm³"],"why":"d = 200 g / 100 cm³ = 2 g/cm³.","src":"Foto 2 · Densidad (aplicación)"},{"type":"mc","q":"¿Qué sucede con las partículas cuando aumenta la temperatura?","a":"Aumenta su agitación","opts":["Aumenta su agitación","Se detienen por completo","Desaparecen"],"why":"Según la teoría cinético-molecular, la temperatura se relaciona con la agitación de las partículas.","src":"Foto 3 · Teoría cinético-molecular"},{"type":"match","q":"Relaciona cada cambio de estado.","pairs":[["Fusión","Sólido a líquido"],["Condensación","Gas a líquido"],["Solidificación","Líquido a sólido"],["Sublimación","Sólido a gas"]],"why":"Los cambios de estado transforman el estado físico, no la identidad de la sustancia.","src":"Foto 3 · Cambios de estado"},{"type":"tf","q":"La evaporación solo puede producirse a la temperatura de ebullición.","a":false,"why":"La evaporación ocurre en la superficie del líquido a distintas temperaturas; la ebullición ocurre en todo el líquido a una temperatura determinada para una presión dada.","src":"Foto 5 · Evaporación y ebullición"},{"type":"fill","q":"El paso directo de sólido a gas se denomina ____.","a":"sublimación","opts":["sublimación","fusión","condensación"],"why":"La sublimación evita el estado líquido.","src":"Foto 3 · Cambios de estado"},{"type":"order","q":"Ordena los estados del agua al calentar hielo hasta producir vapor.","items":["Sólido (hielo)","Líquido (agua)","Gaseoso (vapor)"],"why":"El calentamiento puede producir primero fusión y después vaporización.","src":"Foto 4 · Gráfica de calentamiento"},{"type":"mc","q":"¿Qué representa un tramo horizontal en la gráfica de calentamiento de una sustancia pura a presión constante?","a":"Un cambio de estado a temperatura constante","opts":["Un cambio de estado a temperatura constante","Que la sustancia deja de recibir energía","Que la masa aumenta"],"why":"Durante el cambio de estado la energía se utiliza en la transformación y la temperatura permanece constante.","src":"Foto 4 · Gráfica de calentamiento"},{"type":"tf","q":"La energía solar es un recurso renovable.","a":true,"why":"La energía solar se repone naturalmente y se clasifica como renovable.","src":"Foto 5 · Recursos renovables"},{"type":"mc","q":"¿Cuál de los siguientes es un recurso no renovable?","a":"Petróleo","opts":["Petróleo","Viento","Luz solar"],"why":"El petróleo tarda muchísimo tiempo en formarse y sus reservas son limitadas.","src":"Foto 6 · Recursos no renovables"},{"type":"mc","q":"Si un material tiene densidad 4 g/cm³ y volumen 3 cm³, ¿qué masa tiene?","a":"12 g","opts":["12 g","1,33 g","7 g"],"why":"m = d × V = 4 × 3 = 12 g.","src":"Foto 2 · Fórmula de la densidad"}]};
const PRIMARIA_LENGUA_5={"title":"¡No es justo! · Lengua 5.º Primaria","emoji":"📚","summary":["La justicia consiste en tratar a las personas de forma equitativa y escuchar sus razones antes de decidir.","Las palabras simples no se forman por la unión de otras palabras; las compuestas combinan dos o más palabras o elementos, como sacapuntas o girasol.","Un diptongo reúne dos vocales en una misma sílaba; un triptongo reúne tres vocales en una misma sílaba, con una vocal abierta entre dos cerradas átonas.","Los sustantivos nombran personas, animales, objetos, lugares, ideas y sentimientos. Pueden ser comunes o propios, individuales o colectivos, concretos o abstractos.","Los adjetivos expresan cualidades y pueden estar en grado positivo, comparativo o superlativo.","Una reclamación formal explica un problema, identifica lo sucedido y solicita una solución con lenguaje claro y respetuoso."],"questions":[{"type":"mc","q":"¿Qué es lo más adecuado cuando alguien considera que ha sufrido una injusticia?","a":"Escuchar y dialogar","opts":["Escuchar y dialogar","Ignorar a la persona","Decidir sin conocer los hechos"],"why":"Dialogar permite comprender lo sucedido y buscar una solución justa.","src":"Págs. 38–39 · Justicia"},{"type":"tf","q":"Ser justo significa escuchar las razones de las personas implicadas.","a":true,"why":"Escuchar ayuda a tomar decisiones equitativas.","src":"Págs. 38–39 · Justicia"},{"type":"mc","q":"¿Cuál de estas palabras es compuesta?","a":"Sacapuntas","opts":["Sacapuntas","Justo","Mesa","Libro"],"why":"Sacapuntas se forma con saca + puntas.","src":"Pág. 43 · Palabras compuestas"},{"type":"match","q":"Relaciona cada palabra compuesta con sus elementos.","pairs":[["Girasol","gira + sol"],["Paraguas","para + aguas"],["Abrelatas","abre + latas"],["Baloncesto","balón + cesto"]],"why":"Las palabras compuestas unen dos o más elementos léxicos.","src":"Pág. 43 · Palabras compuestas"},{"type":"fill","q":"La palabra compuesta formada por «para» y «aguas» es ____.","a":"paraguas","opts":["paraguas","pararrayos","parabrisas"],"why":"Para + aguas da lugar a paraguas.","src":"Pág. 43 · Palabras compuestas"},{"type":"mc","q":"¿Cuál de estas palabras es simple?","a":"Libro","opts":["Libro","Sacacorchos","Girasol","Lavavajillas"],"why":"Libro no está formado por la unión de dos palabras independientes.","src":"Pág. 43 · Palabras simples"},{"type":"mc","q":"¿Qué es un diptongo?","a":"Dos vocales en una misma sílaba","opts":["Dos vocales en una misma sílaba","Tres consonantes seguidas","Dos vocales en sílabas distintas"],"why":"En un diptongo, dos vocales se pronuncian en una misma sílaba.","src":"Pág. 44 · Diptongos"},{"type":"mc","q":"¿Qué palabra contiene un diptongo?","a":"Hielo","opts":["Hielo","Teatro","Poeta","Aéreo"],"why":"Hielo contiene el diptongo ie.","src":"Pág. 44 · Diptongos"},{"type":"mc","q":"¿Cuál de estas palabras contiene un triptongo?","a":"Buey","opts":["Buey","País","Río","Teatro"],"why":"Buey presenta tres vocales en una misma sílaba.","src":"Pág. 44 · Triptongos"},{"type":"tf","q":"En «canción», la tilde se escribe sobre la vocal abierta del diptongo.","a":true,"why":"La palabra es aguda terminada en n; en el diptongo ió la tilde recae sobre o.","src":"Pág. 44 · Acentuación"},{"type":"fill","q":"La palabra «murciélago» lleva tilde porque es ____.","a":"esdrújula","opts":["esdrújula","llana","aguda"],"why":"Murciélago es esdrújula y todas las esdrújulas llevan tilde.","src":"Pág. 44 · Acentuación"},{"type":"mc","q":"¿Cuál es la forma correcta de la palabra?","a":"Averigüéis","opts":["Averigüéis","Averigueis","Averigüeis"],"why":"La diéresis indica que la u se pronuncia; la tilde corresponde a la acentuación de averigüéis.","src":"Pág. 45 · Triptongos"},{"type":"mc","q":"¿Qué clase de sustantivo es «Madrid»?","a":"Propio","opts":["Propio","Común","Colectivo"],"why":"Madrid es un nombre propio de lugar.","src":"Pág. 46 · Sustantivos"},{"type":"match","q":"Relaciona los sustantivos colectivos con un individuo del grupo.","pairs":[["Rebaño","Oveja"],["Orquesta","Músico"],["Jauría","Perro"],["Cordillera","Montaña"]],"why":"Los sustantivos colectivos designan conjuntos en singular.","src":"Pág. 46 · Colectivos"},{"type":"mc","q":"¿Cuál es un sustantivo abstracto?","a":"Alegría","opts":["Alegría","Mesa","Gato","Ventana"],"why":"Alegría nombra un sentimiento, no un objeto físico.","src":"Pág. 46 · Sustantivos abstractos"},{"type":"mc","q":"En «un perro cariñoso», ¿qué palabra es el adjetivo?","a":"Cariñoso","opts":["Cariñoso","Perro","Un"],"why":"Cariñoso expresa una cualidad del sustantivo perro.","src":"Pág. 46 · Adjetivos"},{"type":"match","q":"Relaciona cada expresión con el grado del adjetivo.","pairs":[["Alto","Positivo"],["Más alto que","Comparativo"],["Altísimo","Superlativo"]],"why":"Los grados expresan una cualidad sin comparación, comparándola o con máxima intensidad.","src":"Pág. 47 · Grados del adjetivo"},{"type":"mc","q":"¿Qué grado tiene «menos hábil que»?","a":"Comparativo de inferioridad","opts":["Comparativo de inferioridad","Positivo","Superlativo"],"why":"Menos ... que compara dos elementos indicando menor intensidad.","src":"Pág. 47 · Comparativos"},{"type":"order","q":"Ordena las fases recomendadas para redactar una reclamación.","items":["Explicar los hechos","Solicitar una solución","Revisar el texto"],"why":"Primero se exponen los hechos, después se pide una solución y finalmente se revisa el escrito.","src":"Pág. 49 · Reclamación"},{"type":"mc","q":"¿Cuál es la expresión más apropiada en una reclamación formal?","a":"Solicito que revisen el problema","opts":["Solicito que revisen el problema","¡Sois unos inútiles!","No pienso explicar lo sucedido"],"why":"Una reclamación debe ser clara, respetuosa y concreta.","src":"Pág. 49 · Reclamación"},{"type":"tf","q":"Una reclamación debe incluir el problema y la solución que se solicita.","a":true,"why":"Explicar qué ocurrió y qué solución se desea facilita su tramitación.","src":"Pág. 49 · Reclamación"},{"type":"mc","q":"¿Qué dato no conviene publicar en una actividad escolar compartida?","a":"DNI y domicilio personal","opts":["DNI y domicilio personal","Título del tema","Curso escolar"],"why":"Para practicar reclamaciones en clase deben utilizarse datos ficticios, no datos personales reales.","src":"Pág. 49 · Reclamación"}]};

const state={tab:'study',openTopic:null,summaryTopic:null,cards:null,pendingPracticeId:null,session:null,done:null,message:'',messageType:'success',modalText:null,modalTitle:null,parseError:null,aiError:null,aiBusy:false,selectedFiles:[],nativeStatus:'Comprobando disponibilidad…',nativeProgress:'',nativeOCR:'',nativeJSON:'',nativeError:'',nativeBusy:false};
function toast(msg,type='success'){state.message=msg;state.messageType=type;render();}
function byId(id){return store.topics.find(t=>t.id===id)}
const qKey=(id,index)=>id+'::'+index;
function topicStats(id){const p=getProfile();p.topics[id]??={questions:{},lastAt:null};p.topics[id].questions??={};return p.topics[id]}
function questionStats(id,index){const t=topicStats(id);t.questions[index]??={seen:0,firstCorrect:0,wrong:0};return t.questions[index]}
function flagged(id,index){return !!getProfile().flags[qKey(id,index)]}
function eligible(id,index){return !!byId(id)?.questions[index]&&!flagged(id,index)}
function mastery(t){const a=t.questions.map((q,i)=>flagged(t.id,i)?null:topicStats(t.id).questions[i]).filter((v)=>v!==null);return a.length?Math.round(100*a.reduce((n,s)=>n+((s?.firstCorrect||0)/Math.max(1,s?.seen||0)),0)/a.length):0}
function lastLabel(t){const d=topicStats(t.id).lastAt;return d?'Última vez: '+new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short'}):'Todavía sin estudiar'}
function localDay(ms){const d=new Date(ms);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function streak(){const days=new Set(getProfile().sessions.map(x=>localDay(x.at)));let n=0,d=new Date();if(!days.has(localDay(d))){d.setDate(d.getDate()-1)}while(days.has(localDay(d))){n++;d.setDate(d.getDate()-1)}return n}
function recentSessions(){const today=new Date();today.setHours(0,0,0,0);const min=today.getTime()-6*86400000;return getProfile().sessions.filter(s=>s.at>=min)}
function metrics(){const a=recentSessions(),tc=a.reduce((n,s)=>n+s.firstCorrect,0),tt=a.reduce((n,s)=>n+s.firstTotal,0);return {days:new Set(a.map(s=>localDay(s.at))).size,sessions:a.length,percent:tt?Math.round(100*tc/tt):0,minutes:Math.round(a.reduce((n,s)=>n+s.seconds,0)/60)}}
function weakest(limit=5){const all=[];store.topics.forEach(t=>t.questions.forEach((q,i)=>{if(flagged(t.id,i))return;const s=topicStats(t.id).questions[i];if(s?.seen&&s.wrong>0)all.push({topic:t,index:i,question:q,stats:s,score:s.wrong/s.seen})}));return all.sort((a,b)=>b.score-a.score||b.stats.wrong-a.stats.wrong).slice(0,limit)}

function smartPriority(z,now){if(!z?.seen)return 8+Math.random();const missed=(z.wrong||0)/Math.max(1,z.seen);return isDue(z,now)?14+missed*5+Math.random():1+missed*2+Math.random()*.2}

}

return `<button class="back" data-action="close-session">← Salir de la sesión</button><div class="progress-meta"><span>${x.retry?'↻ Recuperación':'Pregunta '+(s.pos+1)} de ${s.queue.length}</span><span>${s.mode==='Examen'?'📝 '+s.firstTotal+' respondidas':'⭐ '+s.firstCorrect+' acertadas a la primera'}</span></div><div class="progress"><span style="width:${progress}%"></span></div><div class="card"><div class="row-split" style="justify-content:space-between"><span class="chip">${esc(x.topic.emoji)} ${esc(x.topic.title)}</span><button class="iconbtn" data-action="speak" title="Escuchar pregunta" aria-label="Escuchar pregunta">🔊</button></div><div class="exercise-label" style="margin-top:18px">${typeLabel}</div>${shownQuestion}${q.type==='fill'?'<p class="hint">Toca una de las palabras para completar el hueco.</p>':''}${controls}</div>${s.feedback?`<div class="feedback ${s.feedback.correct?'good':'bad'}" role="status"><div class="inner"><strong>${s.feedback.correct?'✅ ¡Muy bien!':'🟠 ¡Seguimos aprendiendo!'}</strong><p>${esc(s.feedback.text)}</p>${s.mode==='Examen'?'':`<div class="src">Fuente: ${esc(q.src)}</div>`}<button class="report" data-action="flag" ${flagged(x.topicId,x.index)?'disabled':''}>${flagged(x.topicId,x.index)?'🚩 Pregunta marcada':'🚩 Hay un error en esta pregunta'}</button><button class="btn primary full" data-action="next">Continuar →</button></div></div>`:''}`}
function grade(correct){const x=current(),s=state.session;if(!x||s.feedback)return;const q=x.q;const first=!x.retry;const exam=s.mode==='Examen';if(first){const st=questionStats(x.topicId,x.index),now=Date.now();st.seen++;if(correct){st.firstCorrect++;s.firstCorrect++;getProfile().stars++;st.reviewStep=Math.min(6,(st.reviewStep||0)+1)}else{st.wrong++;st.reviewStep=0;if(!exam&&!s.queue.some((r,i)=>i>s.pos&&r.topicId===x.topicId&&r.index===x.index))s.queue.push({...x,retry:true});}st.dueAt=now+(correct?[0,1,3,7,14,30,60][st.reviewStep]*DAY:4*3600000);s.firstTotal++;topicStats(x.topicId).lastAt=now}else if(!correct){/* Las recuperaciones falladas vuelven al siguiente repaso. */}
const correctAnswer=q.type==='tf'?(q.a?'Verdadero':'Falso'):q.type==='order'?q.items.join(' → '):q.type==='match'?'Las parejas de la lección':q.a;
s.feedback=exam?{correct:true,text:'Respuesta registrada. Verás tu resultado al terminar.'}:{correct,text:correct?(q.why||'¡Has relacionado todo correctamente!'):`Respuesta correcta: ${correctAnswer}. ${q.why||'Revisa las parejas de este tema.'}`};if(!exam)sound(correct?'yes':'no');save();render()}
function next(){const s=state.session;if(!s)return;s.feedback=null;s.pos++;while(s.pos<s.queue.length&&!eligible(s.queue[s.pos].topicId,s.queue[s.pos].index))s.pos++;if(s.pos>=s.queue.length){finish();return}initInteraction();render();window.scrollTo?.(0,0)}
function finish(){const s=state.session;if(!s)return;const seconds=Math.max(1,Math.round((Date.now()-s.startedAt)/1000)),at=Date.now();getProfile().sessions.push({at,seconds,firstTotal:s.firstTotal,firstCorrect:s.firstCorrect,mode:s.mode});getProfile().sessions=getProfile().sessions.slice(-700);state.done={correct:s.firstCorrect,total:s.firstTotal,minutes:Math.max(1,Math.ceil(seconds/60))};state.session=null;save();sound('finish');render();burst()}
function donePage(){const d=state.done;return `<div class="card session-done"><div class="huge">🎉</div><h2>¡Sesión completada!</h2><p>Has repasado sin prisas. Las preguntas difíciles volverán cuando toque repasarlas.</p><div class="metrics" style="margin:20px 0"><div class="metric"><strong>${d.correct}/${d.total}</strong><span>Aciertos a la primera</span></div><div class="metric"><strong>⭐ ${d.correct}</strong><span>Estrellas ganadas</span></div></div><p class="muted">Las preguntas falladas han vuelto al final de la sesión.</p><button class="btn primary full big" data-action="finish-home">Volver a mis temas</button></div>`}
function reportText(){const p=getProfile(),m=metrics(),weak=weakest(5);return `REPASUMI · INFORME DE 7 DÍAS\nAlumno: ${store.learners.find(x=>x.id===store.currentId)?.name||'Alumno'}\nDías estudiados: ${m.days}\nSesiones completadas: ${m.sessions}\nAciertos a la primera: ${m.percent}%\nMinutos aproximados: ${m.minutes}\n\nDOMINIO POR TEMA\n${store.topics.map(t=>`• ${t.title}: ${mastery(t)}%`).join('\n')||'Sin temas'}\n\nPREGUNTAS MÁS FLOJAS\n${weak.map(w=>`• ${w.question.q} (${w.stats.wrong}/${w.stats.seen} fallos a la primera)`).join('\n')||'Sin fallos registrados'}\n\nFEEDBACK\n¿Estudió sin que se lo pidieran?: ${p.feedback.independent||'Sin responder'}\n¿Pagarías?: ${p.feedback.pay||'Sin responder'}\nNota: ${p.feedback.note||'Sin nota'}\n\nDatos almacenados solo en este dispositivo.`}
async function copyText(value,title){try{if(globalThis.AndroidBridge?.copyText){globalThis.AndroidBridge.copyText(value);toast('Copiado al portapapeles.');return}if(!navigator.clipboard?.writeText)throw Error('Portapapeles no disponible');await navigator.clipboard.writeText(value);toast('Copiado al portapapeles.')}catch(e){state.modalTitle=title;state.modalText=value;render()}}
function modal(){if(state.modalText===null)return '';return `<div class="modal-wrap" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">${esc(state.modalTitle||'Copia este texto')}</h3><p class="hint">Si no se puede copiar automáticamente, mantén pulsado sobre el texto para seleccionarlo.</p><textarea id="modal-value" readonly>${esc(state.modalText)}</textarea><button class="btn primary full" data-action="close-modal">Cerrar</button></div></div>`}
function render(){const a=$('#app');let content=state.cards?cardsPage():state.session?lesson():state.done?donePage():state.tab==='study'?study():state.tab==='add'?add():parents();a.innerHTML=`<div class="shell ${state.session?'practice':''} ${store.largeText?'large-text':''}">${header()}${message()}${content}</div>${nav()}`;$('#overlay').innerHTML=modal()}
function validText(v,path,max=260,min=1){if(typeof v!=='string'||v.trim().length<min||v.length>max)throw Error(`${path}: debe ser un texto de ${min} a ${max} caracteres.`);return v.trim()}
function validate(raw){if(!raw||Array.isArray(raw)||typeof raw!=='object')throw Error('El contenido debe ser un objeto JSON de tema.');const t={};t.title=validText(raw.title,'title',90);t.emoji=validText(raw.emoji,'emoji',12);if(!Array.isArray(raw.summary)||raw.summary.length<4||raw.summary.length>6)throw Error('summary: debe contener entre 4 y 6 frases.');t.summary=raw.summary.map((x,i)=>validText(x,`summary[${i+1}]`,300));if(!Array.isArray(raw.questions)||raw.questions.length<1||raw.questions.length>60)throw Error('questions: debe contener entre 1 y 60 preguntas.');t.questions=raw.questions.map((q,i)=>{const name=`Pregunta ${i+1}`;if(!q||typeof q!=='object'||Array.isArray(q))throw Error(`${name}: formato no válido.`);if(!['mc','tf','fill','match','order'].includes(q.type))throw Error(`${name}: tipo incorrecto (mc, tf, fill, match u order).`);const z={type:q.type,q:validText(q.q,`${name} · q`,240),src:validText(q.src,`${name} · src`,120)};if(q.why!==undefined)z.why=validText(q.why,`${name} · why`,350);if(['mc','tf','fill','order'].includes(q.type)&&!z.why)throw Error(`${name}: falta la explicación why.`);
if(q.type==='tf'){if(typeof q.a!=='boolean')throw Error(`${name}: a debe ser true o false.`);z.a=q.a}
if(q.type==='mc'||q.type==='fill'){z.a=validText(q.a,`${name} · a`,120);if(!Array.isArray(q.opts)||q.opts.length<2||q.opts.length>6)throw Error(`${name}: opts debe incluir de 2 a 6 opciones.`);z.opts=q.opts.map((v,j)=>validText(v,`${name} · opts[${j+1}]`,120));if(new Set(z.opts.map(x=>x.toLocaleLowerCase('es'))).size!==z.opts.length)throw Error(`${name}: las opciones de opts deben ser únicas.`);if(!z.opts.includes(z.a))throw Error(`${name}: la respuesta a debe estar incluida en opts.`);if(q.type==='fill'&&!z.q.includes('____'))throw Error(`${name}: las preguntas fill deben contener ____ en q.`)}
if(q.type==='match'){if(!Array.isArray(q.pairs)||q.pairs.length<2||q.pairs.length>6)throw Error(`${name}: pairs debe tener de 2 a 6 parejas.`);z.pairs=q.pairs.map((pair,j)=>{if(!Array.isArray(pair)||pair.length!==2)throw Error(`${name}: cada pareja debe tener dos textos.`);return pair.map((x,k)=>validText(x,`${name} · pareja ${j+1} · ${k+1}`,120))});for(const k of [0,1])if(new Set(z.pairs.map(v=>v[k].toLocaleLowerCase('es'))).size!==z.pairs.length)throw Error(`${name}: los elementos de cada columna de pairs deben ser únicos.`)}
if(q.type==='order'){if(!Array.isArray(q.items)||q.items.length<3||q.items.length>6)throw Error(`${name}: items debe tener de 3 a 6 elementos.`);z.items=q.items.map((x,j)=>validText(x,`${name} · item ${j+1}`,120));if(new Set(z.items.map(x=>x.toLocaleLowerCase('es'))).size!==z.items.length)throw Error(`${name}: items no puede tener elementos repetidos.`)}return z});return t}
function parseInput(txt){const content=txt.trim();const match=content.match(/```(?:json)?\s*([\s\S]*?)```/i);let parsed;try{parsed=JSON.parse((match?match[1]:content).trim())}catch(e){throw Error('El texto no es un JSON válido. Comprueba las comillas, las comas y los bloques de código.')}return validate(parsed)}
function importTopic(){const textarea=$('#json');const json=textarea?.value||'';try{const t=parseInput(json);t.id=randomId();t.createdAt=Date.now();store.topics.push(t);save();state.parseError=null;state.tab='study';toast('Tema «'+t.title+'» añadido. Revisa su exactitud antes de estudiar.')}catch(e){state.parseError=e.message;render()}}
function speech(){const x=current();if(!x)return;try{const question=x.q.q.replace(/____/g,'hueco');if(globalThis.AndroidBridge?.speak){globalThis.AndroidBridge.speak(question);return}if(!('speechSynthesis'in window))return toast('Este navegador no admite lectura en voz alta.','error');speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(question);utter.lang='es-ES';utter.rate=.92;speechSynthesis.speak(utter)}catch(e){toast('No se ha podido reproducir la lectura.','error')}}
let audioContext;
function sound(kind){if(!store.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;const freqs=kind==='yes'?[520,690]:kind==='finish'?[440,550,730]:[250];freqs.forEach((freq,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.07,now+i*.1+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.14);o.connect(g);g.connect(audioContext.destination);o.start(now+i*.1);o.stop(now+i*.1+.15)})}catch(e){}}
function burst(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<35;i++){const el=document.createElement('span');el.className='confetti';el.style.background=['#F3C66D','#30A68E','#FF977F','#5D9CE8'][i%4];el.style.setProperty('--x',`${Math.round((Math.random()-.5)*340)}px`);el.style.setProperty('--y',`${Math.round((Math.random()-.5)*420)}px`);el.style.setProperty('--r',`${Math.round(Math.random()*500)}deg`);document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}}
async function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const result=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);resolve(result)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('No se ha podido leer una imagen.'))};img.src=url})}
async function generateAI(){if(!sampleAvailable()){state.aiError='La capacidad de IA no está disponible en este entorno.';return render()}const photos=Array.from($('#photos')?.files||[]);if(!photos.length||photos.length>6){state.aiError='Selecciona entre 1 y 6 imágenes.';return render()}if(photos.some(f=>!f.type.startsWith('image/'))){state.aiError='Solo se admiten imágenes.';return render()}const level=$('#level').value;state.aiBusy=true;state.aiError='';render();try{const limits=await globalThis.sample.limits();if(limits?.remaining===0||limits?.requestsRemaining===0)throw Error('Se ha alcanzado el límite de generación de IA.');const images=await Promise.all(photos.map(shrink));const prompt=IA_PROMPT.replace('[Primaria o ESO]',level);/* La API sample solo se invoca desde este clic; no se almacenan imágenes. */const result=await globalThis.sample({prompt,images,imagesEnabled:true});const value=typeof result==='string'?result:result?.text||result?.output_text||result?.content?.map(x=>x.text||'').join('')||'';if(!value)throw Error('La IA no devolvió ningún JSON reconocible.');const t=parseInput(value);t.id=randomId();t.createdAt=Date.now();store.topics.push(t);save();state.tab='study';state.aiError='';toast('Tema generado. Comprueba el contenido con el libro antes de estudiar.')}catch(e){state.aiError='No se pudo generar el tema: '+(e?.message||'Error desconocido') }finally{state.aiBusy=false;render()}}
function doFlag(){const x=current();if(!x)return;getProfile().flags[qKey(x.topicId,x.index)]=true;state.session.queue=state.session.queue.filter((r,i)=>i<=state.session.pos||r.topicId!==x.topicId||r.index!==x.index);save();render()}
function handleClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;switch(a){case 'tab':state.tab=btn.dataset.tab;state.cards=null;state.session=null;state.done=null;state.summaryTopic=null;state.message='';state.parseError=null;render();break;case 'sound':store.sound=!store.sound;save();render();break;case 'font-toggle':store.largeText=!store.largeText;save();render();break;case 'cards-open':cardsStart(id);break;case 'cards-close':state.cards=null;render();break;case 'cards-flip':if(state.cards){state.cards.revealed=true;render()}break;case 'cards-rate':cardRate(btn.dataset.rating==='good');break;case 'exam':startSession(planForTopic(byId(id),10),'Examen');break;case 'quick':startSession(planQuick(),'Repaso inteligente');break;case 'practice':beginTopicPractice(id);break;case 'summary':state.summaryTopic=id;render();break;case 'summary-back':state.summaryTopic=null;render();break;case 'copy-topic':{const t=byId(id);if(t){const {id:unused,createdAt:unused2,...out}=t;copyText(JSON.stringify(out,null,2),'Copia la lección en JSON')}break}case 'delete-topic':{const t=byId(id);if(t&&confirm(`¿Borrar «${t.title}» de este dispositivo?`)){store.topics=store.topics.filter(x=>x.id!==id);for(const p of Object.values(store.profiles)){delete p.topics?.[id];for(const key of Object.keys(p.flags||{}))if(key.startsWith(id+'::'))delete p.flags[key]}save();toast('Tema borrado.')}break}case 'copy-prompt':copyText(IA_PROMPT,'Copia las instrucciones para tu IA');break;case 'import':importTopic();break;case 'ai-generate':generateAI();break;case 'native-check':globalThis.AndroidBridge?.checkModel();break;case 'native-model':globalThis.AndroidBridge?.importModel();break;case 'native-download-link':globalThis.AndroidBridge?.openModelPage();break;case 'native-photos':state.nativeJSON='';state.nativeOCR='';state.nativeError='';state.nativeProgress='';globalThis.AndroidBridge?.scanPhotos();break;case 'native-generate':if(state.nativeBusy)break;state.nativeBusy=true;state.nativeJSON='';state.nativeError='';state.nativeProgress='Preparando inferencia local…';try{globalThis.AndroidBridge?.generateFromOCR($('#native-level')?.value||'Primaria');}catch(err){state.nativeBusy=false;state.nativeError='No se pudo iniciar el motor local: '+err.message;}render();setTimeout(()=>{if(state.nativeBusy){state.nativeProgress='La generación local sigue en curso. Puede tardar varios minutos en este dispositivo; no cierres la aplicación.';render();}},90000);break;case 'native-import':try{const t=parseInput($('#native-json')?.value||'');t.id=randomId();t.createdAt=Date.now();store.topics.push(t);save();state.tab='study';state.nativeJSON='';toast('Tema añadido. Comprueba los hechos con el libro antes de estudiar.')}catch(err){state.nativeError='No se ha podido importar: '+err.message;render()}break;case 'choose':{if(state.session?.feedback)return;const x=current(),chosen=state.session.interaction.choices[Number(btn.dataset.choice)];grade(chosen===x.q.a);break}case 'truth':if(!state.session?.feedback)grade((btn.dataset.value==='true')===current().q.a);break;case 'match-left':{const s=state.session;if(s?.feedback)return;const v=s.interaction,i=Number(btn.dataset.index);if(!v.matched.includes(i)){v.matchLeft=i;v.info='Ahora toca la pareja de la columna derecha.';render()}break}case 'match-right':{const s=state.session;if(s?.feedback)return;const v=s.interaction,i=Number(btn.dataset.index),left=v.matchLeft;if(left===null){v.info='Primero elige una opción de la izquierda.';render();break}const good=current().q.pairs[left][1]===v.rights[i];if(good){v.matched.push(left);v.selectedRight.push(i);v.matchLeft=null;v.info='¡Pareja encontrada!';if(v.matched.length===current().q.pairs.length){grade(!v.hadMistake);return}}else{v.hadMistake=true;v.info='Esas dos no forman pareja. Inténtalo otra vez.';sound('no')}render();break}case 'move':{if(state.session?.feedback)return;const arr=state.session.interaction.order,i=Number(btn.dataset.index),j=i+(btn.dataset.direction==='up'?-1:1);if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];render()}break}case 'check-order':{const q=current().q;grade(state.session.interaction.order.every((val,i)=>val===q.items[i]));break}case 'speak':speech();break;case 'next':next();break;case 'flag':doFlag();break;case 'close-session':if(confirm('¿Salir de esta sesión? El progreso ya respondido quedará guardado.')){state.session=null;state.done=null;render()}break;case 'finish-home':state.done=null;state.tab='study';render();break;case 'add-student':{const input=$('#name'),name=(input?.value||'').trim();if(!/^[\p{L}][\p{L}\p{M}\s'-]{0,23}$/u.test(name)){toast('Introduce solo el nombre de pila (1–24 caracteres).','error');break}const student={id:randomId(),name};store.learners.push(student);store.currentId=student.id;save();toast('Alumno añadido: '+name);break}case 'delete-student':{if(store.learners.length>1&&confirm('¿Eliminar el perfil y sus métricas locales?')){delete store.profiles[store.currentId];store.learners=store.learners.filter(x=>x.id!==store.currentId);store.currentId=store.learners[0].id;save();render()}break}case 'restore':delete getProfile().flags[qKey(id,Number(btn.dataset.index))];save();render();break;case 'copy-report':copyText(reportText(),'Selecciona y copia el informe');break;case 'close-modal':state.modalText=null;state.modalTitle=null;render();break}}
$('#app').addEventListener('click',handleClick);$('#overlay').addEventListener('click',handleClick);
$('#app').addEventListener('change',e=>{if(e.target.id==='student'){store.currentId=e.target.value;save();render()}if(e.target.dataset.feedback){getProfile().feedback[e.target.dataset.feedback]=e.target.value;save()}if(e.target.id==='photos'&&e.target.files.length>6){state.aiError='Puedes añadir un máximo de 6 fotografías.';render()}});
$('#app').addEventListener('input',e=>{if(e.target.id==='note'){getProfile().feedback.note=e.target.value.slice(0,1000);save()}if(e.target.id==='json')state.parseError=null});
window.repasumiNativeEvent=(event,payload)=>{try{if(event==='model'){state.nativeStatus=payload;state.nativeError='';}else if(event==='ocr_progress'||event==='ai_progress'){state.nativeProgress=payload;}else if(event==='ocr_result'){const data=JSON.parse(payload);state.nativeOCR=data.text;state.nativeProgress='OCR completado: '+data.readable+' de '+data.total+' fotos legibles.';}else if(event==='practice_result'){finishTopicGeneration(payload);return;}else if(event==='practice_error'){const id=state.pendingPracticeId;state.pendingPracticeId=null;state.nativeBusy=false;state.nativeError=payload;const t=byId(id);if(t){toast('IA local no disponible. Usando preguntas del tema.','error');startSession(planForTopic(t),'Tema · banco existente');}return;}else if(event==='ai_result'){state.nativeBusy=false;state.nativeJSON=JSON.stringify(JSON.parse(payload),null,2);state.nativeProgress='Lección preparada: verifica cada respuesta antes de guardarla.';}else if(event==='error'){state.nativeBusy=false;state.nativeError=payload;state.nativeProgress='';}render();}catch(e){state.nativeError='Error al procesar el resultado local: '+e.message;render();}};
if(nativeAvailable())globalThis.AndroidBridge.checkModel();
/* Los objetos EXAMPLE y todo JSON importado se validan antes de guardarse. */
try{validate(EXAMPLE);validate(ESO_MATERIA_2);validate(PRIMARIA_LENGUA_5)}catch(e){console.error('Error al validar los temas incluidos:',e)}
save();render();
})();
